apiVersion: apps/v1
kind: Deployment
metadata:
  name: repoiq-frontend
  labels:
    app.kubernetes.io/name: repoiq-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: repoiq-frontend
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: repoiq-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: repoiq-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
