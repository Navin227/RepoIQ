apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: repoiq-ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /health
            pathType: Exact
            backend:
              service:
                name: repoiq-backend
                port:
                  number: 8000
          - path: /search
            pathType: Prefix
            backend:
              service:
                name: repoiq-backend
                port:
                  number: 8000
          - path: /analyze
            pathType: Prefix
            backend:
              service:
                name: repoiq-backend
                port:
                  number: 8000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: repoiq-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: repoiq-frontend
                port:
                  number: 3000
